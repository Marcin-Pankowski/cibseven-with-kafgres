spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cibseven
    username: postgres
    password: postgres
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kyc-approval
      auto-offset-reset: earliest

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    filter:
      create: Alle Aufgaben

# Verbindung Kafka-Topic <-> BPMN-Message (Name der Message im BPMN-Modell)
kafka-bpm:
  # Eingehend: Nachricht auf dem Topic korreliert die Message (Start- oder Zwischenereignis).
  # Kafka-Key = Business Key, JSON-Value = Prozessvariablen.
  inbound:
    - topic: kyc.approval.requested
      message: KycApprovalRequested
  # Ausgehend: Message-End-/Throw-Event mit delegateExpression ${kafkaPublisher} sendet auf das Topic.
  outbound:
    - message: KycApproved
      topic: kyc.approval.approved
    - message: KycRejected
      topic: kyc.approval.rejected

